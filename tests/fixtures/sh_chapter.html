<p>The sect gates were closed.</p>
<p>That had never happened before, not in the eleven years Li Wei had swept the courtyard, and the broom in his hands suddenly felt like a weapon he did not know how to use.</p>
<p>"Open them," someone said behind him. It was his own voice.</p>
